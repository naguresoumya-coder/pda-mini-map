<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDA College Mini Map & Navigation Prototype</title>
    
    <!-- Leaflet CSS and JS CDN Links -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Arial, sans-serif; background-color: #1a1a1a; overflow: hidden; }
        #map { height: 78vh; width: 100%; }
        
        #dashboard { 
            height: 22vh; padding: 12px 20px; background: #1e1e1e; box-shadow: 0 -4px 15px rgba(0,0,0,0.6);
            display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; color: #fff;
        }
        .left-panel { max-width: 50%; }
        h1 { margin: 0 0 3px 0; font-size: 15px; letter-spacing: 0.5px; color: #4CAF50; text-transform: uppercase; }
        h2 { margin: 0 0 8px 0; font-size: 12px; color: #aaa; font-weight: normal; }
        #route-output { margin: 0; font-size: 13px; font-weight: bold; color: #00E676; background: #2a2a2a; padding: 6px 10px; border-radius: 4px; display: inline-block; border: 1px solid #444; }
        
        .right-panel { display: flex; gap: 15px; align-items: center; }
        .control-group { background: #2a2a2a; padding: 8px 12px; border-radius: 6px; border: 1px solid #444; }
        .control-group label { display: block; font-size: 10px; color: #aaa; margin-bottom: 3px; text-transform: uppercase; }
        select { background: #333; color: #fff; border: 1px solid #555; padding: 5px; border-radius: 4px; font-size: 12px; outline: none; }
        
        button { background: #4CAF50; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; }
        button:hover { background: #45a049; }

        /* Permanent building label styling */
        .building-label {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #00E676;
            color: #fff;
            font-weight: bold;
            padding: 2px 5px;
            font-size: 10px;
            border-radius: 3px;
            white-space: nowrap;
        }

        /* Modal Overlay for Photos & QR */
        #modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center;
        }
        #modal-content {
            background: #252525; padding: 20px; border-radius: 8px; width: 600px; max-width: 90%;
            border: 1px solid #444; color: #fff; position: relative; text-align: center;
        }
    </style>
</head>
<body>

    <!-- Main Satellite Map Container -->
    <div id="map"></div>

    <!-- Control & Status Dashboard -->
    <div id="dashboard">
        <div class="left-panel">
            <h1>PDA College Mini Map Engine</h1>
            <h2>A* Routing & Campus Spatial Navigator</h2>
            <div id="route-output">Computing optimal path...</div>
        </div>
        
        <div class="right-panel">
            <div class="control-group">
                <label>Start Location</label>
                <select id="start-select" onchange="updateRoute()">
                    <option value="main_gate">Main Gate</option>
                    <option value="canara_bank">Canara Bank</option>
                    <option value="clock_tower">Clock Tower</option>
                    <option value="cse_dept">CSE Department</option>
                    <option value="library">PDA Library</option>
                    <option value="mech_dept">Mechanical Dept</option>
                    <option value="ece_dept">Electronics Dept</option>
                    <option value="civil_dept">Civil Dept</option>
                    <option value="canteen">College Canteen</option>
                </select>
            </div>

            <div class="control-group">
                <label>Destination</label>
                <select id="dest-select" onchange="updateRoute()">
                    <option value="cse_dept">CSE Department</option>
                    <option value="library">PDA Library</option>
                    <option value="mech_dept">Mechanical Dept</option>
                    <option value="ece_dept">Electronics Dept</option>
                    <option value="civil_dept">Civil Dept</option>
                    <option value="canteen">College Canteen</option>
                    <option value="clock_tower">Clock Tower</option>
                </select>
            </div>

            <button onclick="openQRCodeModal()" style="background:#2196F3;">Mobile QR</button>
        </div>
    </div>

    <!-- Modal Popup for Photos & QR -->
    <div id="modal-overlay">
        <div id="modal-content">
            <h3 id="modal-title" style="color: #4CAF50; margin-bottom: 10px;">Campus View</h3>
            
            <!-- Dynamic Building Photo Element -->
            <img id="modal-image" src="" alt="Campus Building" style="width: 100%; height: 320px; object-fit: cover; border-radius: 4px; display: none; margin-bottom: 15px;" />
            
            <!-- QR Container Element -->
            <div id="qr-container" style="display: none; padding: 10px;">
                <p style="color: #ccc; font-size: 13px; margin-bottom: 10px;">Scan this code to test on your mobile device:</p>
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=https://github.com" alt="QR Code" style="border-radius: 4px;" />
            </div>

            <div>
                <button onclick="closeModal()" style="background: #e74c3c; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;">Close</button>
            </div>
        </div>
    </div>

    <script>
        // 1. Exact GPS Coordinates & Photo URLs for Campus Nodes
        const campusNodes = {
            'main_gate':   { name: "Main Gate",           lat: 17.315551, lng: 76.833042, image: "https://images.unsplash.com/photo-1541339907198-e08756dedf3f?w=600" },
            'canara_bank': { name: "Canara Bank",         lat: 17.314940, lng: 76.834240, image: "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=600" },
            'clock_tower': { name: "Clock Tower",         lat: 17.315180, lng: 76.834150, image: "https://images.unsplash.com/photo-1523050854058-8df90110c9f1?w=600" },
            'cse_dept':    { name: "CSE Department",      lat: 17.315572, lng: 76.834229, image: "https://images.unsplash.com/photo-1562774053-701939374585?w=600" },
            'library':     { name: "PDA Library",         lat: 17.314671, lng: 76.834770, image: "https://images.unsplash.com/photo-1521587760476-6c12a4b040da?w=600" },
            'mech_dept':   { name: "Mechanical Dept",     lat: 17.315307, lng: 76.835831, image: "https://images.unsplash.com/photo-1581092160607-ee22621dd758?w=600" },
            'ece_dept':    { name: "Electronics Dept",    lat: 17.315637, lng: 76.835071, image: "https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?w=600" },
            'civil_dept':  { name: "Civil Dept",          lat: 17.314975, lng: 76.835164, image: "https://images.unsplash.com/photo-1503387762-592deb58ef4e?w=600" },
            'canteen':     { name: "College Canteen",     lat: 17.314597, lng: 76.835683, image: "https://images.unsplash.com/photo-1554118811-1e0d58224f24?w=600" }
        };

        // 2. Custom Polygon Boundaries for Campus Blocks
        const campusBuildings = {
            'main_gate': {
                coords: [[17.31560, 76.83310], [17.31560, 76.83298], [17.31550, 76.83298], [17.31550, 76.83310]],
                color: "#FF9800"
            },
            'canara_bank': {
                coords: [[17.31500, 76.83430], [17.31500, 76.83418], [17.31488, 76.83418], [17.31488, 76.83430]],
                color: "#E91E63"
            },
            'clock_tower': {
                coords: [[17.31523, 76.83420], [17.31523, 76.83410], [17.31513, 76.83410], [17.31513, 76.83420]],
                color: "#9C27B0"
            },
            'cse_dept': {
                coords: [[17.31564, 76.83430], [17.31564, 76.83416], [17.31550, 76.83416], [17.31550, 76.83430]],
                color: "#4CAF50"
            },
            'library': {
                coords: [[17.31474, 76.83485], [17.31474, 76.83469], [17.31460, 76.83469], [17.31460, 76.83485]],
                color: "#2196F3"
            },
            'mech_dept': {
                coords: [[17.31538, 76.83591], [17.31538, 76.83575], [17.31523, 76.83575], [17.31523, 76.83591]],
                color: "#FF5722"
            },
            'ece_dept': {
                coords: [[17.31571, 76.83515], [17.31571, 76.83499], [17.31557, 76.83499], [17.31557, 76.83515]],
                color: "#00BCD4"
            },
            'civil_dept': {
                coords: [[17.31505, 76.83524], [17.31505, 76.83508], [17.31490, 76.83508], [17.31490, 76.83524]],
                color: "#8BC34A"
            },
            'canteen': {
                coords: [[17.31467, 76.83576], [17.31467, 76.83560], [17.31453, 76.83560], [17.31453, 76.83576]],
                color: "#FFEB3B"
            }
        };

        // 3. Topological Graph (Walking Weights in Meters)
        const campusGraph = {
            'main_gate':   { 'clock_tower': 130, 'ece_dept': 220 },
            'clock_tower': { 'main_gate': 130, 'canara_bank': 45, 'cse_dept': 40, 'ece_dept': 110 },
            'canara_bank': { 'clock_tower': 45, 'library': 90, 'civil_dept': 110 },
            'cse_dept':    { 'clock_tower': 40, 'ece_dept': 80, 'civil_dept': 120 },
            'library':     { 'canara_bank': 90, 'civil_dept': 60, 'canteen': 110 },
            'ece_dept':    { 'main_gate': 220, 'clock_tower': 110, 'cse_dept': 80, 'mech_dept': 120 },
            'civil_dept':  { 'canara_bank': 110, 'cse_dept': 120, 'library': 60, 'canteen': 80 },
            'mech_dept':   { 'ece_dept': 120, 'canteen': 140 },
            'canteen':     { 'civil_dept': 80, 'library': 110, 'mech_dept': 140 }
        };

        // 4. Heuristic Mapping for A*
        function getHeuristic(node, goal) {
            const latDiff = campusNodes[node].lat - campusNodes[goal].lat;
            const lngDiff = campusNodes[node].lng - campusNodes[goal].lng;
            return Math.sqrt(latDiff * latDiff + lngDiff * lngDiff) * 111000;
        }

        let map, routeLayer = null;

        // 5. Initialize Leaflet Satellite Map & Polygons with click-to-view photo bindings
        function initMap() {
            map = L.map('map', {
                center: [17.31515, 76.83440],
                zoom: 17.5,
                zoomControl: true,
                attributionControl: false
            });

            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 20,
                attribution: 'Tiles &copy; Esri'
            }).addTo(map);

            Object.keys(campusBuildings).forEach(key => {
                const bldg = campusBuildings[key];
                const nodeInfo = campusNodes[key];
                const polygon = L.polygon(bldg.coords, {
                    color: bldg.color,
                    weight: 2,
                    fillColor: bldg.color,
                    fillOpacity: 0.45
                }).addTo(map);

                // Bind popup to show building photo option on click
                polygon.bindPopup(`<b>${nodeInfo.name}</b><br><br><button onclick="showBuildingPhoto('${key}')" style="background:#4CAF50; color:white; border:none; padding:5px 10px; border-radius:3px; cursor:pointer;">View Photo</button>`);

                polygon.bindTooltip(nodeInfo.name, {
                    permanent: true,
                    direction: 'center',
                    className: 'building-label'
                });
            });

            updateRoute();
        }

        // 6. A* Pathfinding Engine
        function calculateAStarPath(start, goal) {
            let openSet = [{ node: start, path: [start], g: 0, f: getHeuristic(start, goal) }];
            let closedSet = new Set();

            while (openSet.length > 0) {
                openSet.sort((a, b) => a.f - b.f);
                let current = openSet.shift();
                
                if (closedSet.has(current.node)) continue;
                closedSet.add(current.node);

                if (current.node === goal) return current.path;

                let neighbors = campusGraph[current.node] || {};
                for (let neighbor in neighbors) {
                    if (!closedSet.has(neighbor)) {
                        let gScore = current.g + neighbors[neighbor];
                        let fScore = gScore + getHeuristic(neighbor, goal);
                        openSet.push({ node: neighbor, path: [...current.path, neighbor], g: gScore, f: fScore });
                    }
                }
            }
            return null;
        }

        // 7. Dynamic Route Renderer
        function updateRoute() {
            const start = document.getElementById('start-select').value;
            const dest = document.getElementById('dest-select').value;

            if (routeLayer) map.removeLayer(routeLayer);

            const optimalPath = calculateAStarPath(start, dest);

            if (optimalPath) {
                const latLngs = optimalPath.map(nodeKey => [
                    campusNodes[nodeKey].lat,
                    campusNodes[nodeKey].lng
                ]);

                routeLayer = L.polyline(latLngs, {
                    color: '#00E676',
                    weight: 5,
                    dashArray: '8, 8',
                    opacity: 1.0
                }).addTo(map);

                const readablePathText = optimalPath.map(n => campusNodes[n].name).join(" ➔ ");
                document.getElementById("route-output").innerText = readablePathText;
            } else {
                document.getElementById("route-output").innerText = "No direct path network found.";
            }
        }

        // 8. Show Building Photo Modal
        function showBuildingPhoto(nodeKey) {
            const node = campusNodes[nodeKey];
            if (!node) return;

            document.getElementById('modal-overlay').style.display = 'flex';
            document.getElementById('modal-image').style.display = 'block';
            document.getElementById('qr-container').style.display = 'none';
            document.getElementById('modal-title').innerText = "Campus View: " + node.name;
            document.getElementById('modal-image').src = node.image;
        }

        // 9. Mobile QR Code Modal Control
        function openQRCodeModal() {
            document.getElementById('modal-overlay').style.display = 'flex';
            document.getElementById('modal-image').style.display = 'none';
            document.getElementById('qr-container').style.display = 'block';
            document.getElementById('modal-title').innerText = "Mobile Prototype Evaluation QR";
        }

        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
        }

        window.onload = initMap;
    </script>
</body>
</html>
